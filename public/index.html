  <script>
    // Apply the saved theme before first paint (dark by default) so there's no white flash.
    (function () { var t = 'dark'; try { t = JSON.parse(localStorage.getItem('mm:theme')) || 'dark'; } catch (e) {}
      if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
      if (t === 'light') document.querySelector('meta[name=theme-color]').setAttribute('content', '#ffffff'); })();
    window.__bip = null;
    addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; dispatchEvent(new Event('pm:installable')); });
    addEventListener('appinstalled', function () { window.__bip = null; try { localStorage.setItem('mm:installed', 'true'); } catch (e) {} });
  </script>
